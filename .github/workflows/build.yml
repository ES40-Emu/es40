name: Build

on:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux build (${{ matrix.configuration }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    env:
      # x86_64 keeps the historical artifact names so release asset names don't change.
      ARTIFACT_NAME: ${{ matrix.arch == 'arm64' && format('linux-arm64-{0}', matrix.configuration) || format('linux-{0}', matrix.configuration) }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - arm64
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
        exclude:
          # --with-arch only affects x86 hosts; SSE2 variants would duplicate the base arm64 builds.
          - arch: arm64
            configuration: Release - SSE2
          - arch: arm64
            configuration: Release NS - SSE2
          - arch: arm64
            configuration: Release IDB - SSE2
          - arch: arm64
            configuration: Release NN - SSE2
          - arch: arm64
            configuration: Release NN NS - SSE2
          - arch: arm64
            configuration: Release JIT - SSE2
        configuration:
          - Debug
          - Profile
          - Release
          - Release IDB
          - Release LSM
          - Release LSS
          - Release NN
          - Release NN IDB
          - Release NN LSM
          - Release NN LSS
          - Release NS
          - Release NS IDB
          - Release NS LSM
          - Release NS LSS
          - Release NN NS
          - Release NN NS IDB
          - Release NN NS LSM
          - Release NN NS LSS
          # SSE2 older-host compatibility builds (default is AVX2; see configure.ac --with-arch)
          - Release - SSE2
          - Release NS - SSE2
          - Release IDB - SSE2
          - Release NN - SSE2
          - Release NN NS - SSE2
          # JIT (AsmJit) builds -- adds --enable-asmjit (x64 backend on x86_64, a64 on arm64)
          - Release JIT
          - Release JIT - SSE2

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust for networked configurations
        if: ${{ !contains(matrix.configuration, 'NN') }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          set -euo pipefail

          configuration="${{ matrix.configuration }}"
          is_no_network=0
          if [[ "$configuration" =~ (^|[[:space:]])NN($|[[:space:]]) ]]; then
            is_no_network=1
          fi

          packages=(
            autoconf
            autoconf-archive
            automake
            libtool
            pkg-config
            cmake
            ninja-build
            build-essential
            libx11-dev
            libxt-dev
            libxext-dev
            libxrandr-dev
            libxrender-dev
            libxfixes-dev
            libxi-dev
            libxcursor-dev
            libxinerama-dev
            libxkbcommon-dev
            libxss-dev
            libxtst-dev
            libwayland-dev
            wayland-protocols
            libegl1-mesa-dev
            libgl1-mesa-dev
            # es40_cfg_tui: ncurses plus its form, menu and panel libraries.
            libncurses-dev
            # es40_cfg_gtk: the GTK 3 desktop configuration editor.
            libgtk-3-dev
          )

          if [[ "$is_no_network" -eq 0 ]]; then
            packages+=(libpcap-dev)
          else
            echo "Skipping libpcap-dev install for NN configuration: $configuration"
          fi

          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"

      - name: Build and install latest SDL3
        if: ${{ !contains(matrix.configuration, 'NS') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          SDL_RELEASES_JSON="$(curl -fsSL -H 'User-Agent: github-actions' -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/libsdl-org/SDL/releases?per_page=10 || echo '[]')"
          SDL3_URL="$(printf '%s' "$SDL_RELEASES_JSON" | python3 -c 'import sys,json,re; data=json.load(sys.stdin); data=[data] if isinstance(data,dict) else data; print(next((a.get("browser_download_url","") for rel in data for a in rel.get("assets",[]) if re.match(r"^SDL3-[0-9.]+\\.tar\\.gz$", a.get("name",""))), ""))')"

          if [ -z "$SDL3_URL" ]; then
            echo "Falling back to releases/latest redirect parsing for SDL3 tarball URL"
            latest_loc="$(curl -fsSLI https://github.com/libsdl-org/SDL/releases/latest | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' | tail -n1)"
            latest_tag="${latest_loc##*/}"
            latest_ver="${latest_tag#release-}"
            SDL3_URL="https://github.com/libsdl-org/SDL/releases/download/${latest_tag}/SDL3-${latest_ver}.tar.gz"
          fi

          SDL3_TARBALL="${SDL3_URL##*/}"
          SDL3_SRC_DIR="${SDL3_TARBALL%.tar.gz}"

          curl -fsSL "$SDL3_URL" -o "$SDL3_TARBALL"
          tar -xzf "$SDL3_TARBALL"

          cmake -S "$SDL3_SRC_DIR" -B sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_X11_XSCRNSAVER=OFF
          cmake --build sdl3-build
          sudo cmake --install sdl3-build

      - name: Generate autotools files
        run: sh autogen.sh

      - name: Configure (respect NS/NN configuration)
        run: |
          set -euo pipefail

          configuration="${{ matrix.configuration }}"
          is_no_network=0
          is_no_screen=0
          if [[ "$configuration" =~ (^|[[:space:]])NN($|[[:space:]]) ]]; then
            is_no_network=1
          fi
          if [[ "$configuration" =~ (^|[[:space:]])NS($|[[:space:]]) ]]; then
            is_no_screen=1
          fi

          configure_env=(
            CXXFLAGS="${CXXFLAGS:+$CXXFLAGS }-g -O2 -fpermissive"
            CPPFLAGS="-I$PWD/src/emu"
          )
          # The configuration editor ships with every build, not as a separate download.
          configure_args=(--enable-tui)

          if [[ "$configuration" == *"- SSE2"* ]]; then
            echo "Configuring SSE2 (older-host compat) baseline for: $configuration"
            configure_args+=(--with-arch=sse2)
          fi

          if [[ "$configuration" == *"JIT"* ]]; then
            echo "Configuring with AsmJit JIT for: $configuration"
            configure_args+=(--enable-asmjit)
          fi

          if [[ "$is_no_network" -eq 1 ]]; then
            echo "Configuring without networking for NN configuration: $configuration"
            configure_args+=(--disable-pcap --disable-tap --disable-vmnet --disable-slirp)
          else
            configure_args+=(--enable-slirp)
          fi

          if [[ "$is_no_screen" -eq 1 ]]; then
            echo "Configuring without SDL for NS configuration: $configuration"
            configure_args+=(--disable-sdl)
          else
            configure_env+=(PKG_CONFIG_PATH="$PWD/.github/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}")
          fi

          if [[ "${#configure_args[@]}" -gt 0 ]]; then
            env "${configure_env[@]}" ./configure "${configure_args[@]}"
          else
            env "${configure_env[@]}" ./configure
          fi

          if [[ "$is_no_network" -eq 1 ]] && grep -Eq -- '-DHAVE_(PCAP|TAP_NET|VMNET|SLIRP)' src/Makefile; then
            echo "The NN configuration was configured with a network backend: $configuration"
            exit 1
          fi
          if [[ "$is_no_network" -eq 0 ]] && ! grep -q -- '-DHAVE_SLIRP' src/Makefile; then
            echo "The networked configuration was configured without SLIRP support: $configuration"
            exit 1
          fi

          # vmnet is a macOS-only backend; it must never be enabled on Linux.
          if grep -q -- '-DHAVE_VMNET' src/Makefile; then
            echo "Linux build was configured with vmnet support, which is macOS-only."
            exit 1
          fi
          if grep -Eq '^[^#]*-framework vmnet' src/Makefile; then
            echo "Linux build was configured to link the vmnet framework, which is macOS-only."
            exit 1
          fi

      - name: Build linux configuration validation target
        shell: bash
        run: |
          set -euo pipefail

          # Some source files include "stdafx.h" while the file in-tree is "StdAfx.h".
          # Linux filesystems are case-sensitive, so provide a compatibility symlink.
          if [[ ! -e src/stdafx.h ]]; then
            ln -s StdAfx.h src/stdafx.h
          fi

          make clean

          targets=(es40 es40_cfg es40_cfg_tui es40_cfg_gtk)
          if [[ ! "${{ matrix.configuration }}" =~ (^|[[:space:]])NS($|[[:space:]]) ]]; then
            targets+=(es40_cfg_sdl)
          fi
          make -C src "${targets[@]}" -j"$(nproc)"

      - name: Collect Linux artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/$ARTIFACT_NAME"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"

          for binary in es40 es40_cfg es40_cfg_tui es40_cfg_sdl es40_cfg_gtk; do
            if [[ -f "src/$binary" ]]; then
              cp "src/$binary" "$artifact_dir/"
            fi
          done
          # The GPL/LGPL texts and third-party license notices required with the binaries.
          if [[ -f "$artifact_dir/es40" ]]; then
            cp COPYING COPYING.LGPL src/es40-NOTICES.txt "$artifact_dir/"
          fi

          configuration="${{ matrix.configuration }}"
          if [[ ! "$configuration" =~ (^|[[:space:]])NS($|[[:space:]]) ]]; then
            sdl_lib="$(find /usr/local/lib /usr/lib -maxdepth 1 -type f \( -name 'libSDL3.so*' -o -name 'libSDL3-*.so*' \) 2>/dev/null | head -n1 || true)"
            if [[ -n "$sdl_lib" ]]; then
              cp "$sdl_lib" "$artifact_dir/"
            fi
          fi

          if [[ -z "$(find "$artifact_dir" -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No Linux artifacts were produced in src/."
            exit 1
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/${{ env.ARTIFACT_NAME }}/
          if-no-files-found: error

  linux-package:
    # Installable Linux packages: a .deb (with the setcap postinst for pcap
    # networking) and a .tar.gz, built with CMake against a static SDL3 so the
    # package depends only on distribution libraries. x86_64 ships two CPU
    # baselines because an AVX2 build dies with "Illegal instruction" on older
    # hosts; arm64 has no such switch.
    name: Linux package (${{ matrix.arch }}${{ matrix.cpu != '' && format(', {0}', matrix.cpu) || '' }})
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_NAME: linux-package-${{ matrix.arch }}${{ matrix.cpu != '' && format('-{0}', matrix.cpu) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            cpu: AVX2
            runner: ubuntu-latest
          - arch: x86_64
            cpu: SSE2
            runner: ubuntu-latest
          - arch: arm64
            cpu: ''
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust for the slirp backend
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build build-essential pkg-config dpkg-dev \
            libpcap-dev libncurses-dev libgtk-3-dev \
            libx11-dev libxt-dev libxext-dev libxrandr-dev libxrender-dev libxfixes-dev \
            libxi-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev

      - name: Build static SDL3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SDL_RELEASES_JSON="$(curl -fsSL -H 'User-Agent: github-actions' -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/libsdl-org/SDL/releases?per_page=10 || echo '[]')"
          SDL3_URL="$(printf '%s' "$SDL_RELEASES_JSON" | python3 -c 'import sys,json,re; data=json.load(sys.stdin); data=[data] if isinstance(data,dict) else data; print(next((a.get("browser_download_url","") for rel in data for a in rel.get("assets",[]) if re.match(r"^SDL3-[0-9.]+\\.tar\\.gz$", a.get("name",""))), ""))')"

          if [ -z "$SDL3_URL" ]; then
            echo "Falling back to releases/latest redirect parsing for SDL3 tarball URL"
            latest_loc="$(curl -fsSLI https://github.com/libsdl-org/SDL/releases/latest | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' | tail -n1)"
            latest_tag="${latest_loc##*/}"
            latest_ver="${latest_tag#release-}"
            SDL3_URL="https://github.com/libsdl-org/SDL/releases/download/${latest_tag}/SDL3-${latest_ver}.tar.gz"
          fi

          SDL3_TARBALL="${SDL3_URL##*/}"
          SDL3_SRC_DIR="${SDL3_TARBALL%.tar.gz}"

          curl -fsSL "$SDL3_URL" -o "$SDL3_TARBALL"
          tar -xzf "$SDL3_TARBALL"

          # Static, into a private prefix: the package must not depend on an SDL3 the distribution does not ship.
          cmake -S "$SDL3_SRC_DIR" -B sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl3-prefix" \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_X11_XSCRNSAVER=OFF
          cmake --build sdl3-build
          cmake --install sdl3-build

      - name: Configure
        run: |
          set -euo pipefail
          cpu="${{ matrix.cpu }}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/sdl3-prefix" \
            ${cpu:+-DES40_ARCH=$cpu}

      - name: Build
        run: cmake --build build

      - name: Check the configuration editor leaves es40.cfg untouched
        run: extras/tests/config-roundtrip.sh build/es40_cfg_gtk src/es40.cfg

      - name: Package
        run: |
          set -euo pipefail
          cd build
          cpack -G "DEB;TGZ"
          ls -l ./*.deb ./*.tar.gz

      - name: Install the package and check it
        run: |
          set -euo pipefail
          sudo apt-get install -y ./build/es40_*.deb
          getcap /usr/bin/es40 | grep -q cap_net_raw
          /usr/bin/es40_cfg_gtk --render src/es40.cfg | cmp - src/es40.cfg
          /usr/bin/es40_cfg_tui -h | head -n1

      - name: Upload package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            build/*.deb
            build/*.tar.gz
          if-no-files-found: error

  windows-build:
    name: Windows build (${{ matrix.configuration }}|x64)
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Debug JIT
          - Profile
          - Profile JIT
          - Release
          - Release JIT
          - Release IDB
          - Release LSM
          - Release LSS
          - Release NN
          - Release NN IDB
          - Release NN LSM
          - Release NN LSS
          - Release NS
          - Release NS IDB
          - Release NS LSM
          - Release NS LSS
          - Release NN NS
          - Release NN NS IDB
          - Release NN NS LSM
          - Release NN NS LSS
          # SSE2 older-host compatibility builds (default configs are AVX2)
          - Release - SSE2
          - Release JIT - SSE2
          - Release NS - SSE2
          - Release IDB - SSE2
          - Release NN - SSE2
          - Release NN NS - SSE2

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust for networked configurations
        if: ${{ !contains(matrix.configuration, 'NN') }}
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Provision SDL3 and Npcap SDK
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $configuration = "${{ matrix.configuration }}"
          $isNoNetwork = $configuration -match '(^| )NN( |$)'
          $isNoScreen = $configuration -match '(^| )NS( |$)'

          New-Item -ItemType Directory -Force -Path "C:\dev" | Out-Null

          if (-not $isNoScreen) {
            # Fetch latest SDL3 VC development package and place it under C:\dev\SDL3
          # Prefer release assets; gracefully handle API throttling/error payloads.
          $sdlZipUrl = ""
          try {
            $apiHeaders = @{ "User-Agent" = "github-actions"; "Authorization" = "Bearer $env:GH_TOKEN" }
            $sdlReleases = Invoke-RestMethod -Uri "https://api.github.com/repos/libsdl-org/SDL/releases?per_page=10" -Headers $apiHeaders
            $sdlAsset = $sdlReleases | ForEach-Object { $_.assets } | Where-Object { $_.name -match '^SDL3-devel-[0-9.]+-VC\.zip$' } | Select-Object -First 1
            if ($sdlAsset) { $sdlZipUrl = $sdlAsset.browser_download_url }
          } catch {
            Write-Warning "GitHub API release query failed: $($_.Exception.Message)"
          }

          if (-not $sdlZipUrl) {
            # Fall back to the releases/latest redirect, which is not subject to API rate limits.
            Write-Host "Falling back to releases/latest redirect parsing for SDL3 VC zip URL"
            $latestUrl = (& curl.exe -fsSLI -o NUL -w '%{url_effective}' "https://github.com/libsdl-org/SDL/releases/latest")
            if ($LASTEXITCODE -ne 0 -or -not $latestUrl) { throw "Could not resolve latest SDL release tag via redirect." }
            $latestTag = ([string]$latestUrl).TrimEnd('/').Split('/')[-1]
            $latestVer = $latestTag -replace '^release-', ''
            $sdlZipUrl = "https://github.com/libsdl-org/SDL/releases/download/$latestTag/SDL3-devel-$latestVer-VC.zip"
          }

          $sdlZip = Join-Path $env:RUNNER_TEMP "sdl3-devel.zip"
          $sdlExtract = Join-Path $env:RUNNER_TEMP "sdl3-devel"
          Invoke-WebRequest -Uri $sdlZipUrl -OutFile $sdlZip
          Expand-Archive -Path $sdlZip -DestinationPath $sdlExtract -Force

          $sdlRoot = Get-ChildItem -Path $sdlExtract -Directory | Select-Object -First 1
          if (-not $sdlRoot) { throw "SDL3 archive extraction did not produce a root directory." }

          $sdlTarget = "C:\dev\SDL3"
          Remove-Item -Recurse -Force $sdlTarget -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $sdlTarget | Out-Null

          Copy-Item -Recurse -Force (Join-Path $sdlRoot.FullName "include") (Join-Path $sdlTarget "include")

          $sdlLib = Get-ChildItem -Path $sdlRoot.FullName -Recurse -Filter "SDL3.lib" |
            Where-Object { $_.FullName -match "lib\\x64\\SDL3\.lib$" } |
            Select-Object -First 1
          if (-not $sdlLib) { throw "Could not locate x64 SDL3.lib in SDL3 development archive." }

          $sdlDll = Get-ChildItem -Path $sdlRoot.FullName -Recurse -Filter "SDL3.dll" |
            Where-Object { $_.FullName -match "lib\\x64\\SDL3\.dll$" } |
            Select-Object -First 1
          if (-not $sdlDll) { throw "Could not locate x64 SDL3.dll in SDL3 development archive." }

          $sdlLibReleaseDir = "C:\dev\SDL3\VisualC\x64\Release"
          $sdlLibDebugDir = "C:\dev\SDL3\VisualC\x64\Debug"
          New-Item -ItemType Directory -Force -Path $sdlLibReleaseDir | Out-Null
          New-Item -ItemType Directory -Force -Path $sdlLibDebugDir | Out-Null
          Copy-Item -Force $sdlLib.FullName (Join-Path $sdlLibReleaseDir "SDL3.lib")
          Copy-Item -Force $sdlLib.FullName (Join-Path $sdlLibDebugDir "SDL3.lib")

          $sdlDllDir = "C:\dev\SDL3\bin\x64"
          New-Item -ItemType Directory -Force -Path $sdlDllDir | Out-Null
          Copy-Item -Force $sdlDll.FullName (Join-Path $sdlDllDir "SDL3.dll")

          } else {
            Write-Host "Skipping SDL3 provisioning for NS configuration: $configuration"
          }

          if (-not $isNoNetwork) {
            # Fetch the pinned Npcap SDK and place it under C:\dev\npcap-sdk
          # GitHub releases contain source snapshots, not the binary SDK.
          # Pin the current SDK and avoid the unreliable dist directory index.
          $npcapSdkVersion = "1.16"
          $npcapUrl = "https://npcap.com/dist/npcap-sdk-$npcapSdkVersion.zip"

          $npcapZip = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $npcapExtract = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          & curl.exe --fail --location --silent --show-error --http1.1 `
            --retry 5 --retry-all-errors --retry-delay 5 `
            --connect-timeout 20 --max-time 180 `
            --output $npcapZip $npcapUrl
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Npcap SDK $npcapSdkVersion."
          }
          Expand-Archive -Path $npcapZip -DestinationPath $npcapExtract -Force

          $npcapTarget = "C:\dev\npcap-sdk"
          Remove-Item -Recurse -Force $npcapTarget -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $npcapTarget | Out-Null

          # Normalize SDK layout to the paths expected by the Visual Studio projects:
          #   C:\dev\npcap-sdk\include\pcap.h
          #   C:\dev\npcap-sdk\lib\x64\wpcap.lib
          $npcapIncludeDir = Join-Path $npcapTarget "include"
          $npcapLibDir = Join-Path $npcapTarget "lib\x64"
          New-Item -ItemType Directory -Force -Path $npcapIncludeDir | Out-Null
          New-Item -ItemType Directory -Force -Path $npcapLibDir | Out-Null

          $npcapIncludeSrc = Get-ChildItem -Path $npcapExtract -Recurse -Filter "pcap.h" |
            Where-Object { $_.DirectoryName -match "Include$" } |
            Select-Object -First 1
          if (-not $npcapIncludeSrc) { throw "Could not locate Npcap include directory containing pcap.h." }

          $npcapLibSrc = Get-ChildItem -Path $npcapExtract -Recurse -Filter "wpcap.lib" |
            Where-Object { $_.FullName -match "Lib\\x64\\wpcap\.lib$" } |
            Select-Object -First 1
          if (-not $npcapLibSrc) { throw "Could not locate x64 wpcap.lib in extracted Npcap SDK." }

          Copy-Item -Recurse -Force (Join-Path $npcapIncludeSrc.DirectoryName "*") $npcapIncludeDir
          Copy-Item -Force $npcapLibSrc.FullName (Join-Path $npcapLibDir "wpcap.lib")

          # es40-cfg.vcxproj expects headers/libs in Program Files\Npcap
          $npcapInstallInclude = "C:\Program Files\Npcap\Include"
          $npcapInstallLib = "C:\Program Files\Npcap\Lib\x64"
          New-Item -ItemType Directory -Force -Path $npcapInstallInclude | Out-Null
          New-Item -ItemType Directory -Force -Path $npcapInstallLib | Out-Null
          Copy-Item -Recurse -Force (Join-Path $npcapIncludeSrc.DirectoryName "*") $npcapInstallInclude
          Copy-Item -Force $npcapLibSrc.FullName (Join-Path $npcapInstallLib "wpcap.lib")
          } else {
            Write-Host "Skipping Npcap provisioning for NN configuration: $configuration"
          }

      - name: Verify vmnet is not enabled on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # vmnet is a macOS-only backend; its feature macro must not appear
          # in the Visual Studio projects (the source files are listed but excluded).
          $projects = Get-ChildItem -Path "Visual Studio" -Recurse -Include *.vcxproj, *.vcxproj.filters, *.props
          $hits = $projects | Select-String -Pattern 'HAVE_VMNET'
          if ($hits) {
            $hits | ForEach-Object { Write-Host $_.ToString() }
            throw "Windows projects reference vmnet, which is macOS-only."
          }

      - name: Build Rust networking library
        if: ${{ !contains(matrix.configuration, 'NN') }}
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path "src/network/slirp-rs/Cargo.toml"
          if ($LASTEXITCODE -ne 0) { throw "The Rust SLIRP library failed to build." }

      - name: Build solution
        shell: pwsh
        run: |
          # Every project defines every configuration, so NN/NS drop pcap/SDL rather than
          # needing an SDK the runner skipped provisioning.
          $configuration = "${{ matrix.configuration }}"
          $enableSlirp = if ($configuration -match '(^| )NN( |$)') { "false" } else { "true" }
          msbuild "Visual Studio/es40.sln" /m /p:Configuration="$configuration" /p:Platform="x64" /p:WindowsTargetPlatformVersion="10.0" /p:ES40GitCommit="$env:GITHUB_SHA" /p:Es40EnableSlirp="$enableSlirp"

      - name: Include SDL3 runtime with built binaries
        if: ${{ !contains(matrix.configuration, 'NS') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sdlDll = Get-Item "C:\dev\SDL3\bin\x64\SDL3.dll" -ErrorAction SilentlyContinue
          if (-not $sdlDll) {
            $sdlDll = Get-ChildItem -Path "C:\dev\SDL3" -Recurse -Filter "SDL3.dll" |
              Where-Object { $_.FullName -match "x64" } |
              Select-Object -First 1
          }
          if (-not $sdlDll) { throw "Could not locate SDL3.dll for x64 runtime packaging." }

          $configDir = Join-Path $PWD "Visual Studio/x64/${{ matrix.configuration }}"
          if (-not (Test-Path $configDir)) { throw "Build output directory not found: $configDir" }

          $exeFiles = Get-ChildItem -Path $configDir -Filter "*.exe" -File
          if ($exeFiles.Count -eq 0) { throw "No executables found in build output directory: $configDir" }

          foreach ($exe in $exeFiles) {
            Copy-Item -Force $sdlDll.FullName (Join-Path $exe.DirectoryName "SDL3.dll")
          }

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configDir = Join-Path $PWD "Visual Studio/x64/${{ matrix.configuration }}"
          $artifactDir = Join-Path $env:RUNNER_TEMP "windows-${{ matrix.configuration }}"

          # The native editor is built and packaged in every Windows configuration, including NS/NN.
          if (-not (Test-Path -LiteralPath (Join-Path $configDir "es40-cfg-win32.exe") -PathType Leaf)) {
            throw "Native configuration editor missing from $configDir"
          }

          Remove-Item -Recurse -Force $artifactDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          
          # COPYING (GPL), COPYING.LGPL and *-NOTICES.txt carry the license texts required with the binaries.
          Get-ChildItem -Path $configDir -File |
            Where-Object { $_.Extension -in '.exe', '.dll', '.pdb' -or $_.Name -in 'COPYING', 'COPYING.LGPL', 'es40-NOTICES.txt', 'es40-cfg-tui-NOTICES.txt' } |
            Copy-Item -Destination $artifactDir -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.configuration }}-x64
          path: ${{ runner.temp }}/windows-${{ matrix.configuration }}/
          if-no-files-found: error

  macos-build:
    name: macOS build (${{ matrix.configuration }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Profile
          - Release
          - Release IDB
          - Release LSM
          - Release LSS
          - Release NN
          - Release NN IDB
          - Release NN LSM
          - Release NN LSS
          - Release NS
          - Release NS IDB
          - Release NS LSM
          - Release NS LSS
          - Release NN NS
          - Release NN NS IDB
          - Release NN NS LSM
          - Release NN NS LSS
          # JIT (AsmJit) scaffolding build on the arm64 image: compiles with ES40_JIT but
          # emits no code yet (always falls back to the interpreter). Real-codegen macOS
          # JIT coverage is the separate Intel job below.
          - Release JIT

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust for networked configurations
        if: ${{ !contains(matrix.configuration, 'NN') }}
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          set -euo pipefail

          configuration="${{ matrix.configuration }}"
          is_no_network=0
          if [[ "$configuration" =~ (^|[[:space:]])NN($|[[:space:]]) ]]; then
            is_no_network=1
          fi

          # The runner image preinstalls aws/tap, which Homebrew's tap-trust
          # check now warns about; nothing here uses it.
          brew untap aws/tap || true

          brew update
          brew install \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja

          if [[ "$is_no_network" -eq 0 ]]; then
            brew install libpcap
          else
            echo "Skipping libpcap install for NN configuration: $configuration"
          fi

      - name: Build and install latest SDL3
        if: ${{ !contains(matrix.configuration, 'NS') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Prefer release assets; gracefully handle API throttling/error payloads.
          SDL_RELEASES_JSON="$(curl -fsSL -H 'User-Agent: github-actions' -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/libsdl-org/SDL/releases?per_page=10 || echo '[]')"
          SDL3_URL="$(printf '%s' "$SDL_RELEASES_JSON" | python3 -c 'import sys,json,re; data=json.load(sys.stdin); data=[data] if isinstance(data,dict) else data; print(next((a.get("browser_download_url","") for rel in data for a in rel.get("assets",[]) if re.match(r"^SDL3-[0-9.]+\\.tar\\.gz$", a.get("name",""))), ""))')"

          if [ -z "$SDL3_URL" ]; then
            echo "Falling back to releases/latest redirect parsing for SDL3 tarball URL"
            latest_loc="$(curl -fsSLI https://github.com/libsdl-org/SDL/releases/latest | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' | tail -n1)"
            latest_tag="${latest_loc##*/}"
            latest_ver="${latest_tag#release-}"
            SDL3_URL="https://github.com/libsdl-org/SDL/releases/download/${latest_tag}/SDL3-${latest_ver}.tar.gz"
          fi

          SDL3_TARBALL="${SDL3_URL##*/}"
          SDL3_SRC_DIR="${SDL3_TARBALL%.tar.gz}"

          curl -fsSL "$SDL3_URL" -o "$SDL3_TARBALL"
          tar -xzf "$SDL3_TARBALL"

          cmake -S "$SDL3_SRC_DIR" -B sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_X11=OFF
          cmake --build sdl3-build
          sudo cmake --install sdl3-build

      - name: Provide SDL pkg-config compatibility alias for configure.ac
        if: ${{ !contains(matrix.configuration, 'NS') }}
        run: |
          set -euo pipefail

          mkdir -p .github/pkgconfig
          cat > .github/pkgconfig/sdl.pc <<'EOF'
          prefix=/usr/local
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: sdl
          Description: SDL compatibility alias to SDL3
          Version: 3.0.0
          Requires: sdl3
          EOF

      - name: Generate autotools files
        run: sh autogen.sh

      - name: Configure (respect NS/NN configuration)
        run: |
          set -euo pipefail

          configuration="${{ matrix.configuration }}"
          is_no_network=0
          is_no_screen=0
          if [[ "$configuration" =~ (^|[[:space:]])NN($|[[:space:]]) ]]; then
            is_no_network=1
          fi
          if [[ "$configuration" =~ (^|[[:space:]])NS($|[[:space:]]) ]]; then
            is_no_screen=1
          fi

          configure_env=(
            CXXFLAGS="${CXXFLAGS:+$CXXFLAGS }-g -O2 -fpermissive"
            CPPFLAGS="-I$PWD/src/emu"
          )
          # The configuration editor ships with every build, not as a separate download;
          # ncurses with form, menu and panel comes from the macOS SDK.
          configure_args=(--enable-tui)

          if [[ "$configuration" == *"JIT"* ]]; then
            echo "Configuring with AsmJit JIT (arm64 scaffolding) for: $configuration"
            configure_args+=(--enable-asmjit)
          fi

          if [[ "$is_no_network" -eq 1 ]]; then
            echo "Configuring without networking for NN configuration: $configuration"
            configure_args+=(--disable-pcap --disable-tap --disable-vmnet --disable-slirp)
          else
            configure_args+=(--enable-slirp)
          fi

          if [[ "$is_no_screen" -eq 1 ]]; then
            echo "Configuring without SDL for NS configuration: $configuration"
            configure_args+=(--disable-sdl)
          else
            configure_env+=(PKG_CONFIG_PATH="$PWD/.github/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}")
          fi

          if [[ "${#configure_args[@]}" -gt 0 ]]; then
            env "${configure_env[@]}" ./configure "${configure_args[@]}"
          else
            env "${configure_env[@]}" ./configure
          fi

          if [[ "$is_no_network" -eq 1 ]] && grep -Eq -- '-DHAVE_(PCAP|TAP_NET|VMNET|SLIRP)' src/Makefile; then
            echo "The NN configuration was configured with a network backend: $configuration"
            exit 1
          fi
          if [[ "$is_no_network" -eq 0 ]] && ! grep -q -- '-DHAVE_SLIRP' src/Makefile; then
            echo "The networked configuration was configured without SLIRP support: $configuration"
            exit 1
          fi

          # vmnet is macOS-only, and is expected on every networked macOS build.
          if [[ "$is_no_network" -eq 1 ]]; then
            if grep -q -- '-DHAVE_VMNET' src/Makefile || grep -Eq '^[^#]*-framework vmnet' src/Makefile; then
              echo "The NN configuration was configured with vmnet support: $configuration"
              exit 1
            fi
          else
            if ! grep -q -- '-DHAVE_VMNET' src/Makefile; then
              echo "The macOS build was configured without vmnet support: $configuration"
              exit 1
            fi
            if ! grep -Eq '^[^#]*-framework vmnet' src/Makefile; then
              echo "The macOS build was configured without linking the vmnet framework: $configuration"
              exit 1
            fi
          fi

      - name: Build macOS configuration validation target (${{ matrix.configuration }})
        run: |
          set -euo pipefail

          make clean

          targets=(es40 es40_cfg es40_cfg_tui)
          if [[ ! "${{ matrix.configuration }}" =~ (^|[[:space:]])NS($|[[:space:]]) ]]; then
            targets+=(es40_cfg_sdl)
          fi
          make -C src "${targets[@]}" -j"$(sysctl -n hw.ncpu)"

      - name: Collect macOS artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/macos-${{ matrix.configuration }}"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"

          for binary in es40 es40_cfg es40_cfg_tui es40_cfg_sdl es40_vmnet_helper; do
            if [[ -f "src/$binary" ]]; then
              cp "src/$binary" "$artifact_dir/"
            fi
          done
          # The GPL/LGPL texts and third-party license notices required with the binaries.
          if [[ -f "$artifact_dir/es40" ]]; then
            cp COPYING COPYING.LGPL src/es40-NOTICES.txt "$artifact_dir/"
          fi

          configuration="${{ matrix.configuration }}"
          if [[ ! "$configuration" =~ (^|[[:space:]])NS($|[[:space:]]) ]]; then
            sdl_lib="$(find /usr/local/lib /opt/homebrew/lib -maxdepth 1 -type f \( -name 'libSDL3*.dylib' -o -name 'SDL3*.dylib' \) 2>/dev/null | head -n1 || true)"
            if [[ -n "$sdl_lib" ]]; then
              cp "$sdl_lib" "$artifact_dir/"
            fi
          fi

          if [[ -z "$(find "$artifact_dir" -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No macOS artifacts were produced in src/."
            exit 1
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.configuration }}
          path: ${{ runner.temp }}/macos-${{ matrix.configuration }}/
          if-no-files-found: error

  macos-x86_64-jit-build:
    # Real JIT codegen is x86-64 only (asmjit x64 backend). The arm64 macos-build matrix above
    # now builds the ES40_JIT scaffolding (interpreter fallback, no a64 codegen yet); this
    # Intel-only job keeps a real-codegen macOS JIT build covered.
    name: macOS x86-64 JIT build (Release JIT)
    runs-on: macos-26-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: |
          set -euo pipefail

          # The runner image preinstalls aws/tap, which Homebrew's tap-trust
          # check now warns about; nothing here uses it.
          brew untap aws/tap || true

          brew update
          brew install \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja \
            libpcap

      - name: Build and install latest SDL3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Prefer release assets; gracefully handle API throttling/error payloads.
          SDL_RELEASES_JSON="$(curl -fsSL -H 'User-Agent: github-actions' -H "Authorization: Bearer ${GH_TOKEN}" https://api.github.com/repos/libsdl-org/SDL/releases?per_page=10 || echo '[]')"
          SDL3_URL="$(printf '%s' "$SDL_RELEASES_JSON" | python3 -c 'import sys,json,re; data=json.load(sys.stdin); data=[data] if isinstance(data,dict) else data; print(next((a.get("browser_download_url","") for rel in data for a in rel.get("assets",[]) if re.match(r"^SDL3-[0-9.]+\\.tar\\.gz$", a.get("name",""))), ""))')"

          if [ -z "$SDL3_URL" ]; then
            echo "Falling back to releases/latest redirect parsing for SDL3 tarball URL"
            latest_loc="$(curl -fsSLI https://github.com/libsdl-org/SDL/releases/latest | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}' | tail -n1)"
            latest_tag="${latest_loc##*/}"
            latest_ver="${latest_tag#release-}"
            SDL3_URL="https://github.com/libsdl-org/SDL/releases/download/${latest_tag}/SDL3-${latest_ver}.tar.gz"
          fi

          SDL3_TARBALL="${SDL3_URL##*/}"
          SDL3_SRC_DIR="${SDL3_TARBALL%.tar.gz}"

          curl -fsSL "$SDL3_URL" -o "$SDL3_TARBALL"
          tar -xzf "$SDL3_TARBALL"

          cmake -S "$SDL3_SRC_DIR" -B sdl3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_X11=OFF
          cmake --build sdl3-build
          sudo cmake --install sdl3-build

      - name: Provide SDL pkg-config compatibility alias for configure.ac
        run: |
          set -euo pipefail

          mkdir -p .github/pkgconfig
          cat > .github/pkgconfig/sdl.pc <<'EOF'
          prefix=/usr/local
          exec_prefix=${prefix}
          libdir=${exec_prefix}/lib
          includedir=${prefix}/include

          Name: sdl
          Description: SDL compatibility alias to SDL3
          Version: 3.0.0
          Requires: sdl3
          EOF

      - name: Generate autotools files
        run: sh autogen.sh

      - name: Configure with AsmJit JIT
        run: |
          set -euo pipefail

          env \
            CXXFLAGS="${CXXFLAGS:+$CXXFLAGS }-g -O2 -fpermissive" \
            CPPFLAGS="-I$PWD/src/emu" \
            PKG_CONFIG_PATH="$PWD/.github/pkgconfig:/usr/local/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            ./configure --enable-asmjit --enable-pcap --enable-slirp --enable-tui

          if ! grep -q -- '-DHAVE_SLIRP' src/Makefile; then
            echo "The macOS x86-64 JIT build was configured without SLIRP support."
            exit 1
          fi
          if ! grep -q -- '-DHAVE_PCAP' src/Makefile; then
            echo "The macOS x86-64 JIT build was configured without pcap support."
            exit 1
          fi
          if ! grep -q -- '-lpcap' src/Makefile; then
            echo "The macOS x86-64 JIT build was configured without linking libpcap."
            exit 1
          fi
          if ! grep -q -- '-DHAVE_VMNET' src/Makefile; then
            echo "The macOS x86-64 JIT build was configured without vmnet support."
            exit 1
          fi
          if ! grep -Eq '^[^#]*-framework vmnet' src/Makefile; then
            echo "The macOS x86-64 JIT build was configured without linking the vmnet framework."
            exit 1
          fi

      - name: Build macOS x86-64 JIT validation target
        run: |
          set -euo pipefail

          make clean

          make -C src es40 es40_cfg es40_cfg_tui es40_cfg_sdl -j"$(sysctl -n hw.ncpu)"

      - name: Collect macOS x86-64 JIT artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/macos-x86_64-Release JIT"
          rm -rf "$artifact_dir"
          mkdir -p "$artifact_dir"

          for binary in es40 es40_cfg es40_cfg_tui es40_cfg_sdl es40_vmnet_helper; do
            if [[ -f "src/$binary" ]]; then
              cp "src/$binary" "$artifact_dir/"
            fi
          done
          # The GPL/LGPL texts and third-party license notices required with the binaries.
          if [[ -f "$artifact_dir/es40" ]]; then
            cp COPYING COPYING.LGPL src/es40-NOTICES.txt "$artifact_dir/"
          fi

          sdl_lib="$(find /usr/local/lib /opt/homebrew/lib -maxdepth 1 -type f \( -name 'libSDL3*.dylib' -o -name 'SDL3*.dylib' \) 2>/dev/null | head -n1 || true)"
          if [[ -n "$sdl_lib" ]]; then
            cp "$sdl_lib" "$artifact_dir/"
          fi

          if [[ -z "$(find "$artifact_dir" -maxdepth 1 -type f -print -quit)" ]]; then
            echo "No macOS x86-64 JIT artifacts were produced in src/."
            exit 1
          fi

      - name: Upload macOS x86-64 JIT artifacts
        uses: actions/upload-artifact@v6
        with:
          name: macos-x86_64-Release JIT
          path: ${{ runner.temp }}/macos-x86_64-Release JIT/
          if-no-files-found: error
