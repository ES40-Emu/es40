name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.70)"
        required: true
      run_id:
        description: "Build run ID to release (blank = latest successful Build run on this branch)"
        required: false
        default: ""
      notes_before:
        description: "Optional note placed above the auto-generated notes"
        required: false
        default: ""
      notes_after:
        description: "Optional note placed below the auto-generated notes"
        required: false
        default: ""
      draft:
        description: "Create as draft for inspection before publishing"
        type: boolean
        default: false

permissions:
  contents: write # create the tag and release
  actions: read # download another run's artifacts

jobs:
  release:
    name: Cut release from build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build run and its commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID_INPUT: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          run_id="$RUN_ID_INPUT"
          if [ -z "$run_id" ]; then
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow build.yml \
              --branch "$GITHUB_REF_NAME" --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$run_id" ]; then
            echo "No successful Build run found on branch $GITHUB_REF_NAME"
            exit 1
          fi

          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)"
          echo "Releasing artifacts from run $run_id (commit $head_sha)"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout release sources and pinned submodules
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.run.outputs.head_sha }}
          path: release-source
          submodules: recursive
          persist-credentials: false

      - name: Download artifacts from the build run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -D dist

      - name: Repack artifacts as release assets
        run: |
          set -euo pipefail

          mkdir -p assets
          for d in dist/*/; do
            # Prebuilt packages (only .tar.gz / .deb inside) ship as-is; re-zipping drops the exec bit.
            if [ -n "$(find "$d" -type f -print -quit)" ] && [ -z "$(find "$d" -type f ! -name '*.tar.gz' ! -name '*.deb' -print -quit)" ]; then
              find "$d" -type f \( -name '*.tar.gz' -o -name '*.deb' \) -exec cp {} assets/ \;
              continue
            fi
            name="$(basename "$d")"
            # GitHub mangles spaces in release asset names; use underscores instead.
            name="${name// /_}"
            (cd "$d" && zip -qr "$GITHUB_WORKSPACE/assets/$name.zip" .)
          done
          ls -l assets

      - name: Package source with submodules
        id: source
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          source_name="es40-${TAG#v}-source"
          source_name="${source_name//\//_}"
          staging_dir="$(mktemp -d "$RUNNER_TEMP/es40-source.XXXXXX")"
          export SOURCE_ROOT="$staging_dir/$source_name"
          mkdir -p "$SOURCE_ROOT" assets

          # git archive honors export-ignore (including docs and HRM) and omits
          # untracked files and Git metadata. Add each pinned submodule separately.
          git -C release-source archive --format=tar HEAD | tar -xf - -C "$SOURCE_ROOT"
          git -C release-source submodule foreach --recursive '
            set -eu
            mkdir -p "$SOURCE_ROOT/$displaypath"
            git archive --format=tar --output="$SOURCE_ROOT/../submodule.tar" "$sha1"
            tar -xf "$SOURCE_ROOT/../submodule.tar" -C "$SOURCE_ROOT/$displaypath"
          '

          tar -czf "$GITHUB_WORKSPACE/assets/$source_name.tar.gz" -C "$staging_dir" "$source_name"
          (cd "$staging_dir" && zip -qry "$GITHUB_WORKSPACE/assets/$source_name.zip" "$source_name")
          echo "name=$source_name" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          NOTES_BEFORE: ${{ inputs.notes_before }}
          NOTES_AFTER: ${{ inputs.notes_after }}
          SOURCE_NAME: ${{ steps.source.outputs.name }}
        run: |
          set -euo pipefail

          # Same generator as the "Generate release notes" button used for previous releases.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -f target_commitish="$HEAD_SHA" --jq .body > generated.md

          {
            if [ -n "$NOTES_BEFORE" ]; then printf '%s\n\n' "$NOTES_BEFORE"; fi
            printf 'Complete source, including third-party submodules: `%s.zip` or `%s.tar.gz` in the release assets. The automatic "Source code" downloads omit submodules.\n\n' "$SOURCE_NAME" "$SOURCE_NAME"
            cat generated.md
            if [ -n "$NOTES_AFTER" ]; then printf '\n\n%s\n' "$NOTES_AFTER"; fi
          } > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ steps.run.outputs.head_sha }}
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          
          if ! tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null)"; then
            tag_sha=""
          fi
          if [ -z "$tag_sha" ]; then
            echo "Creating tag $TAG at $HEAD_SHA"
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$HEAD_SHA" --silent
          elif [ "$tag_sha" != "$HEAD_SHA" ]; then
            echo "Tag $TAG already exists and points at $tag_sha, not the build commit $HEAD_SHA; refusing to release."
            exit 1
          fi

          args=(-R "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md)
          if [ "$DRAFT" = "true" ]; then
            args+=(--draft)
          fi
          gh release create "$TAG" "${args[@]}" assets/*
