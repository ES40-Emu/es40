// Specifying values
//
// Numeric values can be specified as a number ("500"), as a number with a
// suffix ("100K" = 102400), or as a fancy combination ("2G512M" = 2.5 G).
//
// Boolean values can be specified as "true"/"false", "yes"/"no", or "1"/"0".
//
// String-constants are best specified in double quotes ("string"). If the
// string needs to contain double quotes, double the double quotes.
// ("One ""word"" in this string is quoted")
//
// Comments
//
// Three comment forms are recognized: // and ; comment out the rest of the
// line (the ; form only when it is the first non-blank character on the
// line), and /* ... */ comments out a block. A ';' after a value keeps its
// usual meaning as the end of that setting.
//
// Unknown values
//
// The emulator knows which values each device class reads. Any value it
// finds in a device's section that the device does not read is ignored,
// and a warning is printed at startup so you can remove it from this file.

// GUI
//
// If you want to use an emulated graphics card, the emulator needs to interface
// with the OS'es user interface. The supported GUIs are SDL and Win32:
// gui=sdl or gui=win32. SDL requires a build with -DHAVE_SDL.
//
// On systems built with X11 support, the X11 GUI is available, gui=X11.
// It has not seen any upgrading or testing yet compared to Win32 and SDL.
//
// On Windows, gui=win32 selects the native Windows GUI.

gui = sdl
{
  // VARIABLE: keyboard.use_mapping
  //
  // Use a keymap file to translate host keys to guest scancodes. Enable this
  // if you use a non-US keyboard layout. The default is false (US layout,
  // no translation).

  keyboard.use_mapping = false;

  // VARIABLE: keyboard.map
  //
  // The keymap file to use when keyboard.use_mapping is enabled. The default
  // is "keys.map".
  // Entries have three columns, for example: BX_KEY_B 'b' SDLK_A.
  // Win32 accepts SDL-style host names for letters, digits, punctuation,
  // function/navigation keys, keypad keys and left/right modifiers.
  // GUI shortcuts always use host keys, independently of this mapping.

  keyboard.map = "keys.map";

  // VARIABLE: mouse.speed
  //
  // Multiplier applied to host mouse motion before it is passed to the guest.
  // Use a value below 1.0 to slow the guest pointer down (e.g. 0.5 for half
  // speed), or above 1.0 (up to 10.0) to speed it up. The default is 1.0.

  //mouse.speed = 0.5;

  // VARIABLES: mouse.invert_x and mouse.invert_y
  //
  // Reverse the direction of host mouse motion on the horizontal and/or
  // vertical axis. Enable both if the guest pointer moves opposite to your
  // mouse or trackpad in both directions. The defaults are false.

  //mouse.invert_x = true;
  //mouse.invert_y = true;

  // VARIABLE: mouse.absolute
  //
  // Normal desktop users should leave this false (the default) and choose
  // No in either configuration editor. Enable true only for absolute host
  // pointer input. While capture is enabled, this derives mouse movement
  // from successive host window coordinates.
  // The guest still receives relative PS/2 movement; this does not guarantee
  // that its pointer matches an exact host pixel. Speed and inversion apply.

  //mouse.absolute = false;

  // VARIABLE: video.linear
  //
  // Filtering used when the guest display is scaled to the window size:
  // true = linear (smooth), false = nearest neighbor (sharp pixels).
  // The default is true.

  //video.linear = true;

  // VARIABLE: video.scale_ratio
  //
  // Integer scale factor for the emulator window (1 - 8). For example, 2
  // renders the guest's 640x480 display in a 1280x960 window. The default
  // is 0. SDL uses the OS display scale (DPI); native Win32 uses 1x.

  //video.scale_ratio = 2;

  // VARIABLE: video.scale_change_enable
  //
  // Allow changing the window scale factor at runtime with the configured
  // hotkey.scale_up and hotkey.scale_down bindings. The default is false.
  // hotkey.reset_window works with or without this setting.
  // Scale settings and shortcuts apply independently to each output window.

  //video.scale_change_enable = true;

  // VARIABLES: hotkey.*
  //
  // Host key combinations used for GUI actions. Values are quoted,
  // case-insensitive combinations such as "Ctrl+F11" or "GUI+Shift+M".
  // Modifiers, if any, precede exactly one non-modifier key. Supported
  // modifiers are Ctrl, Alt, Shift and GUI; Control, Option, Command, Cmd,
  // Super, Win, Windows and Meta are accepted aliases. The key name uses SDL's
  // names, including F1-F24, PageUp, PageDown, Home, End, Insert, Delete,
  // Escape, letters and digits. PgUp, PgDn, Esc, Del and Ins are also accepted.
  //
  // Win32 also accepts ASCII punctuation, Return, Backspace, Tab, Space,
  // CapsLock, PrintScreen, ScrollLock, Pause, arrows, Numlock,
  // and Keypad 0-9, Keypad Enter, Keypad /, *, -, + and . names. KeypadPlus
  // (KpPlus) and KeypadMinus (KpMinus) are aliases for Keypad + and Keypad -.
  // Only the listed modifiers may be held.
  //
  // Set a binding to "none" to disable that keyboard binding. Invalid or
  // duplicate bindings are reported and the affected actions are disabled.
  //
  // mouse_capture toggles mouse capture; media opens or closes the removable
  // media selector; ctrl_alt_delete sends Ctrl+Alt+Delete to the guest;
  // reset_window restores the guest-driven window size; scale_up and
  // scale_down adjust the runtime window scale.
  //
  // Omitted values use the defaults shown below. The scale bindings take
  // effect only when video.scale_change_enable is true.
  //
  // SDL and Win32 also use Alt+Enter (including keypad Enter) to toggle
  // borderless desktop fullscreen. Configured hotkeys take precedence.
  // Reset-window and runtime scale changes return to windowed mode.

  //hotkey.mouse_capture   = "Ctrl+F10";
  //hotkey.media           = "Ctrl+F11";
  //hotkey.ctrl_alt_delete = "Ctrl+Alt+End";
  //hotkey.reset_window    = "Ctrl+Alt+Home";
  //hotkey.scale_up        = "Ctrl+PageUp";
  //hotkey.scale_down      = "Ctrl+PageDown";
}

sys0 = tsunami 
{

// VARIABLE: graphics.multihead
//
// Experimental support for multiple graphics cards or display outputs with
// SDL or the native Win32 GUI.
// Defaults to false.
// Configure each card in its own pci<bus>.<device> section.
// This permits the configuration.
// It does not select a primary/firmware console.
// X11 supports only one output.
// The BSD CTB repair currently requires a single VGA card
//
  graphics.multihead = false;

// VARIABLE: rom.srm
//
// Specify the filename of the original (compressed) ROM image. This file is 
// essential to the functioning of the emulator. This file an be obtained from HP 
// (it's on the firmware-update CD-ROM for Alpha ES40 systems).
//
// Where to get it: the HP Alpha Systems Firmware Update CD V7.3 holds the ES40
// image as CL67SRMROM.EXE. It is only read until the flash image (rom.flash
// below) has been programmed from it; a ready-programmed 2 MB flash.rom with
// SRM V7.3-1 is at https://archive.org/details/es40-flasher, and with that the
// emulator never opens rom.srm. The GTK editor's "Import firmware" button takes
// either file, or the .zip/.iso containing it, and places it in rom/.
//
  rom.srm = "rom\cl67srmrom.exe";

// VARIABLES: rom.flash and rom.dpr
//
// Specify the filenames of Flash and DPR ROM images. These files are not required,
// but will be created he first time the emulator runs.
// Contents of Flash and DPR ROM will be put in these files after successful 
// termination of the emulator. This allows setting SRM variables such as auto_action
// and boot_osflags. 
//
  rom.flash = "rom\flash.rom";
  rom.dpr = "rom\dpr.rom";

// VARIABLE: rom.toy
//
// Specify the filename of the CMOS/TOY NVRAM image (raw 256 bytes). Like
// rom.flash and rom.dpr, it is not required ("toy.rom" is used if unset) and is
// created on successful termination of the emulator. It emulates the battery
// backing of the real CMOS, preserving SRM console settings kept there (such as
// heap_expand) across emulator restarts.
//
  rom.toy = "rom\toy.rom";

// VARIABLE: memory.bits
//
// Only amounts of memory that are a power of 2 are supported. This number
// determines the amount of memory, by setting the number of bits in the address
// (and thus which power of 2).
//
// 26 = 64 MB
// 27 = 128MB
// 28 = 256 MB
// 29 = 512 MB
// 30 = 1GB
// 31 = 2GB
// 32 = 4GB
// 33 = 8GB
// 34 = 16GB
// 35 = 32GB (platform maximum)
//
  memory.bits = 30;

// VARIABLE: debug.stop_on_decode_conflict (default false)
// Diagnostic: stop before a mapped read/write if more than one component's 
// decode check accepts it. Reports every eligible mapping.
// Aliases on the same component alone do not trigger it. 
// This is not a PCI diagnostic, just a memory model/device diagnostic.
//debug.stop_on_decode_conflict = true;

// VARIABLE: time
//
// Override the guest clock with a fixed date (or date+time). Interpreted as
// UTC, matching the runtime ARC/SRM TOY edit path — the value you write is
// what the guest sees.
// Sets the initial TOY offset; subsequent guest writes (ARC/SRM TOY edits or
// the OS setting the clock) take precedence and overwrite the offset for the
// rest of the run. The override does not survive emulator restart, so set
// this every launch if you need a stable fake date.
// Format: "YYYY-MM-DD" or "YYYY-MM-DD HH:MM:SS"
//
//time = "2017-05-01";              // fake date only
//time = "2017-05-01 12:00:00";     // fake date + time

// VARIABLE: arc_year_compat
//
// Encode the TOY year register as offset from 1980 (instead of the standard
// 2-digit year-mod-100 used by OpenVMS, Tru64 UNIX, Linux, etc).
//
// Background: the ARC console firmware on this emulator reads the TOY year
// byte with a 1980 base — for example, value 26 means 2006, value 46 means
// 2026. OpenVMS and other OSes read the same byte with a 2000 base (with a
// pivot at year 57 for 1900s vs 2000s, see EXE$GL_TRANSITION_YEAR). The two
// conventions disagree by 20 years, so only one console can display the
// correct year at a time.
//
// Off (default): year is encoded year-mod-100. OpenVMS/Tru64/Linux see the
// correct year. ARC displays year - 20 (e.g. 2006 instead of 2026).
//
// On: year is encoded as (year - 1980). ARC displays the correct year.
// OpenVMS will see year + 20 from the BBW (e.g. 2046 instead of 2026), and
// at boot will either prompt the operator for the date, or — if SYSGEN
// TIMEPROMPTWAIT is set to 0 — silently fall back to its last saved system
// time and continue normally.
//
//arc_year_compat = true;

// VARIABLE: exit_on_pal_halt
//
// Usually when then operating system shuts down, it would transfer control
// to the PAL console code. Enabling this option will exit the emulator
// instead.
//
// exit_on_pal_halt = false;

  cpu0 = ev68cb
  {
    // VARIABLE: speed
    //
    // The speed of the CPU reported to guest platforms
    // (in Hz, ranging from 10M to 1250M).
    // This does not affect the speed of the emulation.
    //
    //speed = 500M;

    // VARIABLE: palcode.vms.nohle
    //
    // Disable the high-level emulation (HLE) of the OpenVMS PALcode and run
    // the real SRM PALcode instead. Only meaningful on interpreter builds:
    // JIT builds always run the real PALcode, with or without this. Set it
    // on each CPU. The default is false (HLE enabled where available).

    //palcode.vms.nohle = true;

    // VARIABLE: timer.max_instr_per_tick
    //
    // Upper bound on guest instructions retired between 1024 Hz interval-timer
    // ticks. Real Alpha silicon topped out at 1.25 GHz (EV68)
    //
    // A CPU that reaches this bound before the next wall-clock tick is due is
    // held (slept) until the tick lands, so the guest never sees more than this
    // many instructions per tick and its tick-counted clock stays wall-clock
    // accurate. 

    //timer.max_instr_per_tick = 1250000;

    // VARIABLE: idle_nap
    //
    // Disabled by default. Set true to allow host sleeping on WTINT without
    // enabling automatic idle detection.
    //
    // Sleep the CPU thread when the guest says it is idle, instead of
    // spinning a host core at 100%. The guest says so by issuing
    // CALL_PAL WTINT, which this completes natively. Interrupts and stop/reset
    // requests wake the CPU. The deadline is at most 1ms away and no later
    // than CPU0's next timer tick; host scheduling can still return late.
    // Due interval ticks are serviced after waking, before guest execution.
    //
    // Guests that issue WTINT include VSI OpenVMS 8.4-2L2 and NetBSD/alpha
    // built with a WTINT-aware kernel. Guests that do NOT include HP OpenVMS
    // Alpha 8.4 and Tru64 UNIX 5.1B -- for those see idle_detect below.
    //
    // Host naps are disabled on configurations with more than one CPU.
    //
    //idle_nap = false;

    // VARIABLE: idle_detect
    //
    // Optional heuristic for guests that never issue WTINT. Automatic detection
    // requires a JIT build and is off by default. It looks for repeated PCs
    // after substantial instruction execution (at least 3/4 of the initial
    // dispatch budget between samples). This can also describe useful work.
    // Shares the idle_nap wait; enabling either setting permits it to sleep.
    //
    // The OS name selects a heuristic; it does not verify the running OS.
    // Choosing the wrong name can still trigger unwanted sleeps:
    //
    //   off      no host-side idle detection (default)
    //   vms      OpenVMS
    //   tru64    Tru64 UNIX
    //   netbsd   NetBSD/alpha
    //
    // Historical idle host CPU measurements, before interruptible waits,
    // single CPU, JIT on:
    //
    //   HP OpenVMS Alpha 8.4              101.2% -> 7.5%
    //   Tru64 UNIX 5.1B-4                 100.8% -> 9.4%
    //   NetBSD 10.1/alpha stock GENERIC   100.8% -> 20.7%
    //
    // The 1024 Hz interval tick was unchanged in those measurements; clock
    // accuracy and wake latency still need validation on each host.
    //
    // "vms" additionally checks that VMS PAL PS reports IPL 3 (IPL$_SCHED)
    // at each qualifying sample. It does not establish that the entire
    // dispatch stayed at IPL 3 or that no useful work occurred.
    //
    // "tru64" needs no kernel addresses. It naps only in kernel mode at
    // IPL 0, in a loop that polls memory without storing, walking memory or
    // calling a function on every pass. User-mode code never naps. A kernel
    // lock spin at IPL 0 can still nap.
    //
    // "netbsd" selects the unrestricted spin heuristic. It cannot
    // distinguish idle loops from repetitive computation and can repeatedly
    // sleep during useful work, user mode included. Keep detection off when
    // that tradeoff is unsuitable.
    //
    // Host naps are disabled on configurations with more than one CPU unless
    // idle_mp_wake or idle_mp_nap_us enables them for "tru64" detection.
    // With both idle_detect and idle_nap omitted, neither automatic nor WTINT
    // host naps are enabled.
    // Existing timer pacing remains independent.
    //
    //idle_detect = "off";

    // VARIABLE: idle_nap_poll_us
    //
    // Requested check interval for the portable condition-variable fallback,
    // in microseconds (minimum 1). Interrupts and stop/reset requests notify
    // the wait immediately, independently of this interval. Windows uses a
    // high-resolution deadline timer when available, without periodic polls;
    // otherwise it uses the portable fallback. Actual timing depends on the
    // host scheduler and timer resolution.
    // This setting does not enable napping by itself.
    //
    //idle_nap_poll_us = 100;

    // VARIABLE: idle_spin_count
    //
    // How many consecutive qualifying samples must repeat a remembered PC
    // before idle_detect attempts to sleep. Raise it to delay engagement;
    // it cannot distinguish repetitive useful work from an idle loop.
    // This setting does not enable detection by itself.
    //
    //idle_spin_count = 2;

    // VARIABLE: idle_pc_lo, idle_pc_hi
    //
    // Optional guest address window [idle_pc_lo, idle_pc_hi), hex, for any
    // idle_detect mode: samples outside it never nap. "netbsd" checks no
    // processor state, so the window is its only guard against napping
    // during repetitive work, user mode included. "vms" naps only at IPL 3,
    // which excludes user code; a window also excludes kernel loops that
    // run at IPL 3. "tru64" does not need one. The addresses are valid for
    // one kernel build only; after a rebuild, naps silently stop. The values
    // below are placeholders: take the idle routine and the following
    // symbol from the guest's kernel symbol table (Tru64: nm -x /vmunix).
    //
    //idle_pc_lo = "0xfffffc0000250000";
    //idle_pc_hi = "0xfffffc0000250400";

    // VARIABLE: idle_mp_nap_us
    //
    // Opt-in nap length in microseconds for "tru64" detection with more than
    // one CPU; 0 (default) keeps those CPUs awake. Tru64 hands work to an idle
    // CPU without an interrupt, so the nap ends only at this deadline: 100
    // made pipe ping-pong about 5 times slower (20 -> 96us per switch).
    //
    //idle_mp_nap_us = 0;

    // VARIABLE: idle_mp_wake
    //
    // With more than one CPU, let "tru64" detection nap until another CPU
    // stores to memory the idle loop reads (or an interrupt, at most 1ms).
    // Each nap first runs one pass of the loop to find those 64-byte lines;
    // a loop it cannot follow falls back to idle_mp_nap_us. Set it on every
    // CPU that should nap.
    //
    //idle_mp_wake = false;

    // VARIABLE: idle_detect_debug
    //
    // Log rejected idle candidates with the reason, and every distinct PC
    // that napped instead of only the first.
    //
    //idle_detect_debug = false;
  }

  cpu1 = ev68cb
  {
    speed = 500M;
  }

// System Internal PCI Devices: ali, ali_ide, ali_usb
//
// The following PCI-devices are built into the system, and should
// always be at the PCI-id's they are on in this sample configuration
// file for compatibility. 

  pci0.7 = ali{
    lpt.outfile = "lpt.out";
    vga_console = true;
  }

  pci0.15 = ali_ide
  {
    // VARIABLE: dma
    //
    // Allow the guest to use (busmaster) DMA transfers on this IDE
    // controller. Set to false to force PIO-only operation. The default
    // is true.

    //dma = false;

    // sub-components: disk<x>.<y>
    //
    // Here, up to 4 IDE disks can be defined (0.0, 0.1, 1.0 and 1.1).
    //
    // All disk types (file, device, ramdisk) accept the identity values
    // model_number, serial_number and rev_number, shown in the first disk
    // below. (serial_num and rev_num are accepted as aliases.)
    //
    // file: create a disk using a file on the host filesystem as a disk image
    // CD-ROM devices are not created automatically; define one under whichever
    // IDE or SCSI controller should host it. It may omit file to start empty,
    // for example: disk1.0 = file { cdrom = true; }

    disk0.0 = file
    {
      file =          "img\disk0.img";

      // VARIABLE: format (auto, raw or qcow2)
      // Recognized extensions select the reader unless auto is explicitly set.
      // .cue retains BIN/CUE handling and its initial-load raw fallback.
      // For other filenames, raw or qcow2 selects the reader; auto or an omitted
      // format detects the header. Unrecognized content is treated as raw.
      //format = "auto";

      // VARIABLE: autocreate_format (raw or qcow2, default raw)
      // Applies to a missing file with autocreate_size, including overlay bases.
      // An explicit format must match this setting.
      // Existing files are never replaced. QCOW2 requires a fixed hard disk.
      //autocreate_format = "qcow2";

      // VARIABLE: overlay_file (optional, fixed hard disks only)
      // file names the base; overlay_file names the writable QCOW2 child.
      // The base may be raw or QCOW2. format selects the base format.
      // Both paths resolve like ordinary file paths. An existing overlay must
      // already reference this base; its parent is never changed.
      // A missing overlay is created automatically at the base's virtual size.
      // autocreate_size and autocreate_format apply only to a missing base.
      // Existing bases are never modified. Invalid overlays are errors, not raw
      // images. Without overlay_file, file is mounted normally.
      //overlay_file = "img\work.qcow2";

      serial_number = "VMS";
      rev_number    = "8.3";
      model_number  = "OpenVMS8.3";
      read_only     = false;
      cdrom         = false;

      // A missing file (the base when overlay_file is set) is created at this size.
      autocreate_size = 600M;
    }
    disk1.0 = file
    {
      file =          "img\vms83.iso";
      read_only     = true;
      cdrom         = true;
    }

    // Example: create a writable child over an existing QCOW2 base.
    // Only the child receives guest writes; img\base.qcow2 remains unchanged.
    //disk0.1 = file
    //{
    //  file = "img\base.qcow2";
    //  overlay_file = "img\work.qcow2";
    //  read_only = false;
    //  cdrom = false;
    //  // Optional: create the base too, if it does not exist.
    //  //autocreate_format = "qcow2";
    //  //autocreate_size = 600M;
    //}
    
    // device: create a disk using a physical device
    //
    // WARNING: making a physical disk device writeable here may
    // seriously jeopardize the contents of that disk.
    //
    // Windows syntax for device: \\.\CDRom0, \\.\PhysicalDrive0
    //
    // UNIX-like syntax for device: /dev/sda
    //
    // (Commented out because disk1.0 is already defined above; defining
    // the same disk twice silently replaces the earlier definition.)

    //disk1.0 = device
    //{
    //  device        = "\\.\CDRom0";
    //  read_only     = true;
    //  cdrom         = true;
    //}
    
    // ramdisk: create a disk using a portion of host RAM
    //
    // If a file value is given and the file exists, the ramdisk is sized to
    // the file and preloaded with its contents (a RAM-backed copy of a disk
    // image; changes are not written back to the file).
    disk1.1 = ramdisk
    {
      size = 10M;
      //file = "img\preload.img";
    }
  }

  pci0.19 = ali_usb {}

  pci0.17 = ali_pmu {}

// "Free" PCI Devices
//
// These can occupy pci0 and pci1 in open/available slots.
//
// With graphics.multihead=true, SDL can expose cards on either PCI hose.

  // S3 Trio64 VGA card
  //
  // rom: the VGA BIOS image to use. 
  // The default is "vgabios.bin" in the emulator's working directory.
  // Real S3 Trio64 VGA BIOS images work, GNU vgabios project also works, but
  // may not enable or support all S3 features.
  //
  // wake_on_reset: the emulated Trio64 leaves reset asleep, like the real
  // chip, and only an S3 BIOS knows the setup-register sequence that wakes it.
  // Set this to true with a generic VGA BIOS (GNU vgabios, as shipped by the
  // Debian/Ubuntu "vgabios" package) so the card answers VGA accesses at once.
  // Leave it false (the default) with a real S3 Trio64 BIOS image.

  pci0.2 = s3
  {
    rom = "rom\VGABIOSFILE.bin";
    //wake_on_reset = true;
  }

  // Experimental ELSA GLoria Synergy (Permedia 2, 8 MiB).
  // rom: the VGA BIOS image to use. 
  // The 32 KiB PCI images require an explicit rom_layout:
  // mirror32 repeats the image; pad_ff fills the upper half with FF.
  //pci0.2 = gloria
  //{
  //  rom = "rom/SYN80700.PAN";
  //  rom_layout = "mirror32";
  //  subsystem_from_rom = true; // do not combine with explicit subsystem IDs
  //  allow_dma = true;          // default; requires guest PCI bus mastering
  //}

  // Experimental ATI Radeon 7500 (RV200, 64 MiB), 2D acceleration by PIO only.
  // rom: the PCI option ROM (1002:5157); AGP-tagged images are refused.
  // Non-power-of-two images (48 KiB PCI ROMs) require rom_layout = "pad_ff".
  //pci0.2 = radeon
  //{
  //  rom = "rom/r7500pci.rom";
  //  rom_layout = "pad_ff";
  //}

  // Digital PowerStorm 300/350 (REALimage 2100).
  // rom: the 64 KiB option ROM (10BA:0304).
  // Unimplemented native registers are stored without effect.
  // model: 300 = Compaq (subsystem 0E11:4D31), 350 = Digital (1011:4D35).
  // 300 has 15 MiB framebuffer/16 MiB texture; 350 has 30/32 MiB.
  // Memory population and board straps follow the selected model.
  //pci0.2 = powerstorm
  //{
  //  rom = "rom/BIOS.BIN";
  //  model = 300;
  //}

  // Symbios SCSI controller
  //
  // The 53c810 supports 7 disks (0.0..0.6).
  pci0.3 = sym53c810
  {
   disk0.0 = file
    {
      file =          "img\dka0.img";
      read_only     = false;
      cdrom         = false;
    }
    disk0.4 = file
    {
      file =          "img\scsi_cd.iso";
      read_only     = true;
      cdrom         = true;
    }
    disk0.5 = ramdisk 
    {
      size = 10M;
    }
  }

  // LSI 53C1020 Fusion-MPT SCSI controller
  //
  // The flash value optionally names a persistent raw 512 KiB card image.
  // If the file does not exist, ES40 creates it when possible. Omitting flash
  // leaves the card volatile, so runtime BIOS and IOC firmware changes do
  // not survive an emulator restart. Use a different backing file for every
  // emulated controller.
  //
  // The rom and firmware values are optional first-use seeds. They initialize
  // a new card image but are not reapplied when an existing flash image loads.
  // Missing or invalid seeds do not prevent the behavioral IOC from starting.
  // Use mptps.rom and it_1030.fw from a compatible LSI firmware package; do
  // not use the 53C1020A/1030T firmware with this controller model. The
  // supplied image's 1030-B0 header does not change the emulated 1020 identity.
  // The 53C1020 is not a native Alpha boot controller. SRM may identify it as
  // pka, but has no Fusion-MPT boot driver. AlphaBIOS can execute the optional,
  // unmodified x86 mptps.rom; when it installs successfully, attached disks
  // appear through the SCSIBIOS interface. Firmware-level discovery has been
  // verified, but booting an operating system from such a disk has not. Without
  // the option ROM, or under SRM, disks require guest OS Fusion-MPT support.

  //pci1.1 = lsi53c1020
  //{
  //  flash = "rom\lsi53c1020.flash";
  //  rom = "rom\mptps.rom";
  //  firmware = "rom\it_1030.fw";
  //}

  pci0.4 = dec21143 {

    // VARIABLE: type
    //
    // Selects how this NIC talks to the host network:
    //   "pcap"  (the default) - capture/inject packets on an existing host
    //           adapter via libpcap/npcap. Works on Windows and any Unix
    //           with libpcap.
    //   "tap"   - use a TAP virtual network device. Only available on
    //           Linux, FreeBSD and NetBSD. Plays more nicely with host
    //           firewalling/bridging than pcap's promiscuous capture.
    //   "vmnet" macOS only: Use the macOS vmnet framework which uses a
    //           host's network interface as a bridge to effectively place
    //           the Alpha system on the same subnet as the host.
    //   "slirp" - give the guest a private user-space network, with the
    //           emulator acting as a NAT router, DHCP server and DNS
    //           forwarder. Needs no host privileges, no pre-created
    //           interface and no libpcap; the guest is not reachable from
    //           the host's LAN. See the "slirp*" variables below.
    //
    //   "pcap" is the default when the type is not set.
    //
    //type = "pcap";
    //type = "tap";
    //type = "vmnet";
    //type = "slirp";
    
    // VARIABLE: adapter
    //
    // type = "pcap": defines the host computer's adapter to use for the
    // emulated NIC. If you're unsure of this, start the emulator without
    // this variable set (or set it to "list"), and you will be presented
    // with a list of adapters to choose from. You can enter the name
    // indicated on this line. The question is asked on the emulator's
    // console, so it needs a terminal: a machine started from the
    // configuration editor or as a service must name the adapter here, or
    // use type = "slirp". Capturing needs root or CAP_NET_RAW on Linux.
    //
    // Windows syntax:
    // adapter = "\Device\NPF_{F266CDC2-6BA2-43D8-8B00-1C468F737ED7}"
    //
    // Linux syntax:
    //adapter = "eth0"
    
    //adapter = "\Device\NPF_{F266CDC2-6BA2-43D8-8B00-1C468F737ED7}";

    // type = "tap": the name of the TAP device to use. On Linux this is
    // the TAP interface name. The device must already exist and, unless the
    // emulator runs as root, be owned by the user running it:
    // `sudo ip tuntap add dev <name> mode tap user <user>; sudo ip link set dev <name> up`
    // then add it to a bridge with `ip link set dev <name> master <bridge>`
    // (guest on the LAN) or give it an address and route/NAT it on the host.
    // On FreeBSD/NetBSD this references the TAP device node, eg. /dev/tap0,
    // to be created eg. with `ifconfig tap0 create; ifconfig tap0 up` and
    // add it with `brconfig bridge0 add tap0 up`.
    //
    //adapter = "tap0";

    // type = "vmnet": the name of the host's network interface to use as the bridge
    //
    //adapter = "en0";

    // --- type = "slirp" ------------------------------------------------
    //
    // The guest is placed on a private network whose gateway is the
    // emulator. Traffic to addresses outside "network" is NATed to real
    // host sockets; the guest gets its address over DHCP.
    //
    // VARIABLE: network
    //
    // The private IPv4 subnet (prefix length optional, default /24) the
    // guest lives on. The default is 10.0.2.0/24.
    //
    //network = "10.0.2.0/24";

    // VARIABLE: gateway
    //
    // The address the guest sees as its default gateway (and thus the
    // emulator itself). It must be inside "network"; the default is the
    // host offset .2 of the network, i.e. 10.0.2.2 for 10.0.2.0/24.
    //
    //gateway = "10.0.2.2";

    // VARIABLE: dhcp_start / dhcp_end
    //
    // The inclusive range of addresses the built-in DHCP server hands out.
    // Defaults to host offsets 15..30 of the network (10.0.2.15..10.0.2.30
    // for 10.0.2.0/24).
    //
    //dhcp_start = "10.0.2.15";
    //dhcp_end   = "10.0.2.30";

    // VARIABLE: dns
    //
    // Comma-separated DNS server addresses handed to the guest. When unset,
    // the host's own resolvers are used (falling back to 1.1.1.1 and
    // 8.8.8.8). Queries are NATed to the server like any other traffic.
    //
    //dns = "1.1.1.1,8.8.8.8";

    // VARIABLE: dhcp_lease
    //
    // DHCP lease length, in seconds. The default is 3600 (one hour).
    //
    //dhcp_lease = 3600;

    // -------------------------------------------------------------------

    // VARIABLE: mac
    //
    // Defines the ethernet MAC address to be used by the virtual nic.
    // The variable format is: xx-xx-xx-xx-xx-xx, where all values are in hex.
    // This value should be unique on your network, or Bad Things Will Happen.
    //
    // The default value is: 08-00-2B-E5-40-<nic#>

	//mac = "08-00-2B-E5-40-00";

    // VARIABLE: queue
    //
    // The number of frames the receive queue can hold between the host
    // capture interface and the emulated NIC. Frames that arrive while the
    // queue is full are dropped (and reported on the console). The default
    // is 1024.

    //queue = 1024;

    // VARIABLE: drop_privileges
    //
    // For vmnet interfaces, controls whether privileges are dropped after the
    // interface is initialized. (ES40 starts with privileges enabled but
    // doesn't need privileges once the network interfaces are initialized.)
    // If you configure multiple network interfaces with vmnet, set this
    // variable to false on all but the interface in the highest PCI slot.
    // The default is true.
    
    // drop_privileges = true;
    
    // VARIABLE: crc
    //
    // Calculate a real ethernet CRC (FCS) for frames delivered to the
    // guest. When false, a zeroed placeholder CRC is appended instead,
    // which saves host CPU; guests normally never check it. The default
    // is false.

    //crc = true;

    // VARIABLE: trace_packets
    //
    // Dump every transmitted and received packet to the console, for
    // network debugging. Very noisy. The default is false.

    //trace_packets = true;
  }

// Serial ports
//
// The ES40 hardware always has two serial ports, and SRM and the guest OSes
// expect both UARTs to exist. You do not have to configure both (or either)
// of them: any port missing from this file is synthesized automatically as
// a null_attach port (see below), with a console warning.

  serial0 = serial {

    // VARIABLE: port
    //
    // Determines which Telnet port is opened to receive connections for the emulated
    // serial port. The default is 8000 + the port number.

    port = 21264;

    // VARIABLE: listen_address
    //
    // Local IPv4/IPv6 addresses, separated by commas. No hostnames, brackets or ports.
    // Empty or omitted: all IPv4 and IPv6 interfaces.
    // Use "0.0.0.0" for IPv4 only, "::" for IPv6 only, or "127.0.0.1, ::1" for local access.
    // Link-local IPv6 needs a scope, e.g. "fe80::1%3".
    // All addresses share this port and must bind. One client at a time.
    // Ignored when null_attach or disabled is true.

    // listen_address = "127.0.0.1, ::1";

    // VARIABLE: action
    //
    // Client command. Omit to connect manually. Choose one listen address;
    // for wildcards, use localhost (IPv4) or ::1 (IPv6).
    // Bracket IPv6 URL hosts, e.g. telnet://[::1]:21264.

    action = """c:\Program Files\PuTTY\putty.exe"" telnet://localhost:21264";

    // VARIABLE: wait_for_connection
    //
    // By default the emulator does not start until a telnet client has connected
    // to this port, so no console output is missed. Set this to false for a
    // machine whose console is the graphics window, or one that runs unattended:
    // the port then accepts a client at any time, and output sent before a
    // client connects is dropped. Defaults to true.
    //
    //wait_for_connection = false;

    // VARIABLE: null_attach
    //
    // Present the port to the guest as a healthy, idle UART with nothing
    // attached: transmitted bytes are silently discarded, nothing ever
    // arrives, and no Telnet port is opened. Use this for a port you never
    // intend to connect to. This is also what the emulator synthesizes for
    // a serial port that is left out of the configuration entirely. The
    // default is false.

    //null_attach = true;

    // VARIABLE: disabled
    //
    // Make the guest see no UART at this address at all, so drivers skip
    // the port completely. No Telnet port is opened. Unlike null_attach,
    // the UART appears absent rather than present-but-idle. The default
    // is false.

    //disabled = true;

    // VARIABLE: raw_mode
    //
    // Pass the byte stream through unmodified: no Telnet protocol (IAC)
    // processing and no throttling to emulated line speed. Required when
    // the port carries a binary protocol such as windbg (KD) or kgdb
    // instead of a terminal session. The default is false.

    //raw_mode = true;
  }

  serial1 = serial {
    port = 21265;
    // listen_address = "127.0.0.1, ::1";
    action = """c:\Program Files\PuTTY\putty.exe"" telnet://localhost:21265";
  }

